# Activate with --spring.profiles.active=postgres (or SPRING_PROFILES_ACTIVE=postgres, or
# -Dspring-boot.run.profiles=postgres with spring-boot:run).
# Pair with docker-compose.yml in this module to start a local PostgreSQL instance:
#   docker compose up -d
#   mvn spring-boot:run -Dspring-boot.run.profiles=postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/auditlogserver
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=auditlogserver
spring.datasource.password=auditlogserver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
