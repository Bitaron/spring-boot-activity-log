#-------------------------------------------------------------------------------
# General
#-------------------------------------------------------------------------------
spring.application.name=audit-log-standalone-server

#-------------------------------------------------------------------------------
# Database - H2 in-memory by default, so this runs with zero external setup, mirroring
# audit_log_usage_example. For a realistic, persistent run, activate the "postgres" profile (see
# application-postgres.properties) and start Postgres via docker-compose.yml in this module's
# directory: docker compose up -d && mvn spring-boot:run -Dspring-boot.run.profiles=postgres
#-------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:auditlogserver;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

#-------------------------------------------------------------------------------
# audit-log server - off by default upstream, turned on here since this app's whole purpose is
# running it. Per-tenant API keys (WP16) require the core starter's multi-tenancy flag too - see
# AuditLogServerAutoConfiguration's startup check.
#-------------------------------------------------------------------------------
audit.log.server.enabled=true
audit.log.multi-tenancy.enabled=true

# audit.log.server.api-keys.<tenantId> is deliberately NOT set here. AuditLogServerAutoConfiguration
# throws IllegalStateException at startup if no key is configured for any tenant - there is no safe
# default that leaves the ingest/query endpoints open. Supply at least one as an env var when
# starting this app - Spring Boot's relaxed binding for environment variables uppercases the name
# and replaces "." with "_", but reliably maps a Map<String,String> property key only when that key
# itself has no dashes or dots (relaxed binding can't always tell a literal "-"/"." in a map key
# apart from the nesting separator) - "default" (no dashes) is the tenant id this module's README
# and tests use for exactly that reason:
#   AUDIT_LOG_SERVER_APIKEYS_DEFAULT=<your-secret> mvn spring-boot:run
# For a tenant id that does contain dashes/dots, pass it as a Spring Boot run argument instead,
# where the key is taken literally:
#   mvn spring-boot:run -Dspring-boot.run.arguments=--audit.log.server.api-keys.acme-corp=<your-secret>
