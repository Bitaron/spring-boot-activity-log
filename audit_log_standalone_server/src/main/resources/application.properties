#-------------------------------------------------------------------------------
# General
#-------------------------------------------------------------------------------
spring.application.name=audit-log-standalone-server

#-------------------------------------------------------------------------------
# Database - H2 in-memory by default, so this runs with zero external setup, mirroring
# audit_log_usage_example. For a realistic, persistent run, activate the "postgres" profile (see
# application-postgres.properties) and start Postgres via docker-compose.yml in this module's
# directory: docker compose up -d && mvn spring-boot:run -Dspring-boot.run.profiles=postgres
#-------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:auditlogserver;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

#-------------------------------------------------------------------------------
# audit-log server - off by default upstream, turned on here since this app's whole purpose is
# running it.
#-------------------------------------------------------------------------------
audit.log.server.enabled=true

# audit.log.server.api-key is deliberately NOT set here. AuditLogServerAutoConfiguration throws
# IllegalStateException at startup if it's blank - there is no safe default that leaves the
# ingest/query endpoints open. Supply it as an env var when starting this app - Spring Boot's
# relaxed binding for environment variables uppercases the name, replaces "." with "_" AND drops
# dashes entirely, so "audit.log.server.api-key" becomes AUDIT_LOG_SERVER_APIKEY (not
# ..._API_KEY):
#   AUDIT_LOG_SERVER_APIKEY=<your-secret> mvn spring-boot:run
# Or, to avoid relying on that mapping, pass it directly as a Spring Boot run argument instead:
#   mvn spring-boot:run -Dspring-boot.run.arguments=--audit.log.server.api-key=<your-secret>
