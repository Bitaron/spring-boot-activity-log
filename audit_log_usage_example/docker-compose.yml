services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: activitylog
      POSTGRES_USER: activitylog
      POSTGRES_PASSWORD: activitylog
    ports:
      - "5432:5432"
    volumes:
      - activitylog-postgres-data:/var/lib/postgresql/data

volumes:
  activitylog-postgres-data:
