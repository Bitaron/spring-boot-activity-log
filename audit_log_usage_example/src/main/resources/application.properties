#-------------------------------------------------------------------------------
# General
#-------------------------------------------------------------------------------
spring.application.name=activityLog

#-------------------------------------------------------------------------------
# Database - H2 in-memory by default, so the demo runs with zero external setup.
# For a realistic run against PostgreSQL, activate the "postgres" profile (see
# application-postgres.properties) and start the database in docker-compose.yml.
#-------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:activitylog;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# create-drop is a demo convenience; the starter also ships a schema.sql for real deployments.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# data.sql runs before Hibernate creates the schema unless deferred - without this the
# audit_template seed insert below fails with "Table AUDIT_TEMPLATE not found".
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.jdbc.batch_size=300
spring.jpa.properties.hibernate.order_inserts=false
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=ERROR
#logging.level.org.hibernate.SQL=DEBUG
#spring.jpa.properties.hibernate.format_sql=true

#logging.level.org.commlink.log=DEBUG
#logging.level.org.springframework=DEBUG

#-------------------------------------------------------------------------------
# audit-log starter
#-------------------------------------------------------------------------------
audit.log.header-mappings.requesterId=X-USER-ID
audit.log.header-mappings.requesterName=X-USER-NAME
